<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lilian | صفحه خرید</title>
    <link rel="stylesheet" href="./src/css/output.css" />
    <link rel="icon" type="image/x-icon" href="/src/images/favicon/logo.svg" />
  </head>
  <body class="page-payment">
    <!-- start -->

    <!-- main wrapper desktop -->
    <div class="w-full bg-[#ffffff] mx-auto flex flex-col items-center">
      <div id="site-header"></div>
      <!-- all -->
      <div class="flex flex-col w-360 top-16.25">
        <!-- buying levels -->
        <div
          class="w-124 h-10 flex flex-row justify-between items-center mt-20 mb-15.5 mx-auto"
        >
          <a href="./cart.html">
            <div
              class="w-10 h-10 rounded-full bg-[#525252] border border-[#525252] text-[#F5F5F5] flex items-center justify-center"
            >
              ۱
            </div>
          </a>
          <a
            href="./checkout.html"
            class="w-10 h-10 rounded-full bg-[#525252] border border-[#525252] text-[#F5F5F5] flex items-center justify-center"
          >
            ۲
          </a>
          <div
            class="w-10 h-10 rounded-full bg-[#3D3D3D] border border-[#3D3D3D] text-[#F5F5F5] flex items-center justify-center"
          >
            ۳
          </div>
          <div
            class="w-10 h-10 rounded-full bg-[#E0E0E0] border border-[#7A7A7A] flex items-center justify-center"
          >
            <img
              src="./src/images/svg/check.svg"
              alt=""
              class="w-[23.783782958984375px] h-[18.947368621826172px]"
            />
          </div>
        </div>
        <!-- buying levels -->

        <!-- middle -->
        <div class="flex flex-col gap-6 w-330 mx-auto">
          <div class="flex flex-row gap-6 w-full">
            <div class="flex flex-col gap-6">
              <div
                class="w-246.25 h-20 border border-[#A3A3A3] px-10 py-4 flex flex-col gap-6.25"
              >
                <div class="w-186 h-12 flex flex-row justify-between">
                  <div
                    class="text-[#3D3D3D] w-30.5 h-12 font-bold text-[20px] flex justify-center items-center"
                  >
                    <h2>ثبت کد تخفیف</h2>
                  </div>
                  <form
                    class="w-140 h-12 border border-[#a3a3a3] flex flex-row"
                  >
                    <input
                      type="text"
                      placeholder=""
                      required
                      class="w-full h-full px-4 text-[#a3a3a3] text-[14px] text-right outline-none font-sans"
                    />
                    <button
                      type="submit"
                      class="flex items-center justify-center cursor-pointer bg-[#525252] text-[#F5F5F5] text-[14px] w-28.5 h-full"
                    >
                      <h5>ثبت</h5>
                    </button>
                  </form>
                </div>
              </div>
              <div
                class="w-246 h-20 border border-[#A3A3A3] px-10 py-4 flex flex-col gap-6.25"
              >
                <div class="w-186 h-12 flex flex-row items-center">
                  <div
                    class="text-[#3D3D3D] h-8 font-bold text-[20px] flex justify-center items-center"
                  >
                    <h2 class="ml-18.75 w-27.25">روش پرداخت</h2>
                  </div>
                  <div
                    class="ml-20 w-41 h-8 flex flex-row gap-2 justify-center items-center"
                  >
                    <div class="flex justify-center items-center">
                      <button
                        data-select-button
                        type="button"
                        aria-label="انتخاب گزینه"
                        aria-pressed="false"
                        class="cursor-pointer"
                      >
                        <img
                          src="./src/images/svg/select-button=default.svg"
                          alt=""
                          class="size-6"
                        />
                      </button>
                    </div>
                    <div class="text-[#3d3d3d] font-bold text-[14px]">
                      <h5>پرداخت اینترنتی</h5>
                    </div>
                    <div>
                      <img
                        src="./src/images/svg/card-pos.svg"
                        class="w-6"
                        alt=""
                      />
                    </div>
                  </div>
                  <div
                    class="w-fit h-8 flex flex-row gap-2 justify-center items-center"
                  >
                    <div class="flex justify-center items-center">
                      <button
                        data-select-button
                        type="button"
                        aria-label="انتخاب گزینه"
                        aria-pressed="false"
                        class="cursor-pointer"
                      >
                        <img
                          src="./src/images/svg/select-button=default.svg"
                          alt=""
                          class="size-6"
                        />
                      </button>
                    </div>
                    <div class="text-[#3d3d3d] font-bold text-[14px]">
                      <h5>پرداخت درب محل</h5>
                    </div>
                    <div>
                      <img
                        src="./src/images/svg/wallet.svg"
                        class="w-6"
                        alt=""
                      />
                    </div>
                  </div>
                </div>
              </div>
              <div
                class="flex w-246 h-50 flex-col border border-[#A3A3A3] px-10 py-6"
              >
                <div class="text-[20px] font-bold text-[#3D3D3D]">
                  درگاه پرداخت
                </div>

                <div id="payment-banks" class="mx-auto mt-4 flex gap-4">
                  <button
                    type="button"
                    class="relative size-24 shrink-0 cursor-pointer"
                  >
                    <img
                      src="./src/images/svg/saman-d.jpg"
                      class="block size-24 object-cover grayscale"
                      alt="بانک سامان"
                    />
                    <span
                      class="pointer-events-none absolute inset-0 border border-[#A3A3A3]"
                    ></span>
                  </button>

                  <button
                    type="button"
                    class="relative size-24 shrink-0 cursor-pointer"
                  >
                    <img
                      src="./src/images/svg/mellat-d.jpg"
                      class="block size-24 object-cover grayscale"
                      alt="بانک ملت"
                    />
                    <span
                      class="pointer-events-none absolute inset-0 border border-[#A3A3A3]"
                    ></span>
                  </button>

                  <button
                    type="button"
                    class="relative size-24 shrink-0 cursor-pointer"
                  >
                    <img
                      src="./src/images/svg/sep-d.jpg"
                      class="block size-24 object-cover grayscale"
                      alt="بانک پارسیان"
                    />
                    <span
                      class="pointer-events-none absolute inset-0 border border-[#A3A3A3]"
                    ></span>
                  </button>
                </div>
              </div>
            </div>
            <div
              class="w-78 h-102 border border-[#A3A3A3] flex flex-col pt-6 pb-8 px-4"
            >
              <div>
                <h3 class="text-[#3D3D3D] font-bold text-[18px] text-center">
                  سبد خرید
                </h3>
              </div>
              <div class="flex flex-col gap-6 mt-8">
                <div
                  class="flex flex-row justify-between text-[#666666] font-bold text-[14px]"
                >
                  <div>قیمت کالاها (۲)</div>
                  <div>۵,۰۰۰,۰۰۰ تومان</div>
                </div>
                <div
                  class="flex flex-row justify-between text-[#666666] font-bold text-[14px]"
                >
                  <div>قیمت پست</div>
                  <div>رایگان</div>
                </div>
                <div
                  class="flex flex-row justify-between text-[#3D3D3D] font-bold text-[14px]"
                >
                  <div>جمع سبد خرید</div>
                  <div>۵,۰۰۰,۰۰۰ تومان</div>
                </div>
                <div
                  class="flex flex-row justify-between text-[#D71F1F] font-bold text-[14px]"
                >
                  <div>سود شما از خرید</div>
                  <div>۹۵۰,۰۰۰ تومان</div>
                </div>
              </div>
              <a
                href="./order-result.html"
                class="mt-8 flex h-10 w-70 items-center justify-center bg-[#D71F1F] text-[16px] font-bold text-[#F5F5F5]"
              >
                ثبت سفارش
              </a>
              <div class="border-b border-[#7A7A7A] w-70 my-4"></div>
              <div>
                <h4 class="text-[#525252] text-[14px] mt-3">
                  <b>ارسال رایگان</b> برای خریدهای بالای ۲ ملیون تومان
                </h4>
              </div>
            </div>
          </div>
          <div class="w-full h-14 justify-between flex flex-row">
            <a
              href="./checkout.html"
              class="w-50 h-10 flex flex-row justify-center border border-[#3D3D3D] gap-1 mt-4"
            >
              <img class="w-6" src="./src/images/svg/Arrow Right.svg" alt="" />
              <h5 class="text-[14px] font-bold text-[#3D3D3D] self-center">
                بازگشت به سبد خرید
              </h5>
            </a>
            <a
              href="./order-result.html"
              class="w-50 h-full flex flex-row bg-[#3D3D3D] gap-1 py-4.25 px-9"
            >
              <h5 class="text-[#F5F5F5] text-[14px] font-bold self-center">
                ثبت و ادامه خرید
              </h5>
              <img src="./src/images/svg/Arrow Left.svg" class="w-6" alt="" />
            </a>
          </div>
        </div>
        <!-- middle -->

        <div id="site-footer"></div>
      </div>

      <!-- all -->
    </div>
    <!-- main wrapper desktop -->
    <!-- end of project -->

    <script type="module" src="./src/js/shared.js"></script>
  </body>
</html>
